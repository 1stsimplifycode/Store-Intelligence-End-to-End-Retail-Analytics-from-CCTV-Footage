version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - data_vol:/data
    environment:
      - DB_PATH=/data/store_intelligence.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: python dashboard/live.py
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
    volumes:
      - data_vol:/data
    stdin_open: true
    tty: true

volumes:
  data_vol:
